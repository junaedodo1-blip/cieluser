name: Daily Instagram Carousel Automation (project\ciel)

on:
  schedule:
    # Runs daily at 10:00 AM UTC (4:00 PM BST / 6:00 AM EST)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom Carousel Topic (optional)'
        required: false
        default: ''
      hook_angle:
        description: 'Specific Hook Angle (optional: contrarian_truth, case_study_directing, technical_formula, before_vs_after, step_by_step_anatomy, curiosity_juxtaposition, commerce_conversion)'
        required: false
        default: ''
      force_strict_brand:
        description: 'Force Strict project\\ciel Brand Day'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-daily-carousel:
    name: Generate & Dispatch Daily Carousel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.2

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: 🚀 Run Daily Carousel Pipeline
        id: run_pipeline
        run: |
          ARGS=""
          if [ "${{ inputs.force_strict_brand }}" = "true" ]; then
            ARGS="$ARGS --force-strict-brand"
          fi
          if [ -n "${{ inputs.topic }}" ]; then
            ARGS="$ARGS --topic '${{ inputs.topic }}'"
          fi
          if [ -n "${{ inputs.hook_angle }}" ]; then
            ARGS="$ARGS --angle '${{ inputs.hook_angle }}'"
          fi
          
          node --import tsx/esm scripts/carousel_automation/daily_runner.ts $ARGS
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 💾 Commit & Push Automation State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add carousel_automation_state.json pending_notification_posts.json out/
          git commit -m "chore(automation): update carousel state and lead magnets [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
